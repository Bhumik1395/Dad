# Drop into /etc/nginx/sites-available/corob.conf and symlink into sites-enabled,
# or merge this `server` block into your existing Nginx config if this app shares
# a domain with your other sites (adjust `location` prefixes instead of using a
# whole server block in that case).
#
# Adjust: server_name, the dist path, and the backend port if 8000 is taken.

server {
    listen 80;
    server_name corob-analytics.yourdomain.com;   # <-- change this

    root /var/www/corob-analytics/frontend/dist;  # <-- change to your actual deploy path
    index index.html;

    # Static assets
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # API -> FastAPI (uvicorn/gunicorn running on 127.0.0.1:8000, see corob-backend.service)
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PM report PDFs served by the frontend code at /pm-pdfs/... — point this at
    # wherever those generated PDFs actually live on disk (adjust path).
    location /pm-pdfs/ {
        alias /var/www/corob-analytics/pm-pdfs/;
    }

    # SPA fallback — THIS is what fixes "No page found" on client-side routes
    # like /dashboard/focus, /customer/pm, etc. Without this, only "/" itself
    # would resolve and every other route 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Once this is confirmed working on plain HTTP, put it behind certbot for HTTPS:
#   sudo certbot --nginx -d corob-analytics.yourdomain.com
