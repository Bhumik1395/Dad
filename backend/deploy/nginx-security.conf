# Merge these into deploy/nginx.conf (the http {} level directives go in
# nginx.conf's top-level http block, e.g. /etc/nginx/nginx.conf; the rest go
# inside the existing `server { ... }` block for this app).

# --- In the http {} block (nginx.conf top level) ---------------------------

# Rate-limit zones (shared across all sites on the box — define once).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

# --- In the server {} block for this app ------------------------------------

# Force HTTPS. Run `certbot --nginx` first to get the cert/HTTPS server block;
# this turns the plain-HTTP block from deploy/nginx.conf into a redirect-only
# block once you have TLS.
#   listen 80;
#   server_name corob-analytics.yourdomain.com;
#   return 301 https://$host$request_uri;

# Reject bodies bigger than what the app ever legitimately needs
# (10 files x 50MB each was the stated frontend limit).
client_max_body_size 550m;

# Security headers (belt-and-suspenders alongside SecurityHeadersMiddleware
# in the FastAPI app — set here too so static asset responses get them too,
# not just API responses).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

# Login: tight rate limit, small burst allowance.
location /api/auth/login {
    limit_req zone=login_limit burst=3 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Uploads: looser than login but still capped, and give large uploads more time.
location ~ ^/api/(upload/combined|pm/upload) {
    limit_req zone=upload_limit burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else under /api — general ceiling against scraping/DoS.
location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# fail2ban complements this at the OS level — see SECURITY_HARDENING.md for
# a jail definition that bans IPs hammering /api/auth/login with 401s.
