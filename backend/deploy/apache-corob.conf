<VirtualHost *:80>
    ServerName corob-analytics.yourdomain.com
    Redirect permanent / https://corob-analytics.yourdomain.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName corob-analytics.yourdomain.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/corob.crt
    SSLCertificateKeyFile /etc/ssl/private/corob.key

 
    DocumentRoot /var/www/corob-dashboard
    <Directory /var/www/corob-dashboard>
        Require all granted
        Options -Indexes
        RewriteEngine On
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    Alias /pm-pdfs/ /var/www/corob-analytics/pm-pdfs/
    <Directory /var/www/corob-analytics/pm-pdfs>
        Require all granted
        Options -Indexes
    </Directory>


    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8000/api/ timeout=300
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

 
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"


    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
</VirtualHost>