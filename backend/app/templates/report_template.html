<!DOCTYPE html>
<html>

<head>
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
        }

        body {
            font-family: Helvetica, Arial, sans-serif;
            font-size: 11px;
            color: #1a1a1a;
        }

        h1 {
            font-size: 20px;
            color: #085041;
            margin-bottom: 4px;
        }

        h2 {
            font-size: 14px;
            color: #085041;
            margin-top: 22px;
            border-bottom: 1px solid #ccc;
            padding-bottom: 4px;
        }

        .kpi-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            table-layout: fixed;
        }

        .kpi-table td {
            border: 1px solid #ccc;
            border-radius: 0;
            padding: 8px 10px;
        }

        .kpi-label {
            font-size: 9px;
            color: #666;
            display: block;
        }

        .kpi-value {
            font-size: 16px;
            font-weight: bold;
        }

        .chart-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            table-layout: fixed;
        }

        .chart-table td {
            width: 50%;
            text-align: center;
            vertical-align: top;
            padding: 4px;
        }

        .chart-table img {
            width: 100%;
            height: auto;
            max-width: 320px;
        }
    </style>
</head>

<body>
    <h1>{{ report_title }}</h1>
    <p>Generated: {{ generated_at }}</p>

    <h2>Focus Mode Overview</h2>
    <table class="kpi-table">
        <tr>
            <td><span class="kpi-label">Total Machines</span><span class="kpi-value">{{ kpis.totalMachines }}</span>
            </td>
            <td><span class="kpi-label">Total Calls</span><span class="kpi-value">{{ kpis.totalCalls }}</span></td>
            <td><span class="kpi-label">Under-Norm %</span><span class="kpi-value">{{ kpis.underNormPct }}%</span></td>
            <td><span class="kpi-label">Repeat Calls</span><span class="kpi-value">{{ kpis.repeatCalls }}</span></td>
        </tr>
    </table>

    <table class="chart-table">
        <tr>
            <td><img src="data:image/png;base64,{{ charts.visitType }}" /></td>
            <td><img src="data:image/png;base64,{{ charts.statusBreakdown }}" /></td>
        </tr>
        <tr>
            <td><img src="data:image/png;base64,{{ charts.callsOverTime }}" /></td>
            <td><img src="data:image/png;base64,{{ charts.repeatMachines }}" /></td>
        </tr>
    </table>

    <h2>Employee Performance</h2>
    <table class="chart-table">
        <tr>
            <td><img src="data:image/png;base64,{{ charts.employeeCalls }}" /></td>
            <td><img src="data:image/png;base64,{{ charts.employeeUnderNorm }}" /></td>
        </tr>
    </table>
</body>

</html>
